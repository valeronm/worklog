[workspace]
members = ["crates/*"]
# Every member, so a plain `cargo test` covers the crates as well as the root.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.5.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/valeronm/worklog"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every error type is an enum whose variants are the documentation.
missing_errors_doc = "allow"

[workspace.dependencies]
worklog-domain = { path = "crates/domain" }
worklog-app = { path = "crates/app" }
worklog-render = { path = "crates/render" }
worklog-wiring = { path = "crates/wiring" }
blake3 = "1"
# Without `clock`, which reads the time.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rustix = "1.1.4"
serde = { version = "1", features = ["derive"] }
# preserve_order so a value read back keeps the order its keys were printed in.
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
tempfile = "3"
# preserve_order so a header keeps the order its keys were written in.
toml = { version = "1.1.8", features = ["preserve_order"] }

[package]
name = "worklog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Append-only versioned store of work done, durable facts, follow-ups and topics"
repository.workspace = true

[lints]
workspace = true

[dependencies]
worklog-domain.workspace = true
worklog-app.workspace = true
worklog-render.workspace = true
worklog-wiring.workspace = true
askama = "0.16"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
httparse = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
toml.workspace = true
# Keeps the comments and layout of an agent's config it adds a writable root to.
toml_edit = "0.25.17"

[dev-dependencies]
worklog-domain = { workspace = true, features = ["testing"] }
worklog-app = { workspace = true, features = ["testing"] }
# A test shrinks its sockets' buffers, so a page of a few hundred kilobytes fills them.
rustix = { workspace = true, features = ["net"] }
assert_cmd = "2"
tempfile.workspace = true

# The upgrade scenario hashes a debug binary; unoptimised sha2 makes that
# the slowest test by far.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
