[package]
name = "worklog"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Append-only versioned store of work done, durable facts, follow-ups and topics"
repository = "https://github.com/valeronm/worklog"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# In-memory ports for tests of the layers above the domain; never in the binary.
testing = []

[dependencies]
askama = "0.16"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order so a settings file written back keeps its key order.
serde_json = { version = "1", features = ["preserve_order"] }
similar = { version = "2", features = ["inline"] }
tiny_http = "0.12"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
strip = true
