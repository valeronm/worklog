[workspace]
members = ["crates/domain", "crates/app"]
# Every member, so a plain `cargo test` covers the crates as well as the root.
default-members = [".", "crates/domain", "crates/app"]

[workspace.package]
version = "0.5.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/valeronm/worklog"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every error type is an enum whose variants are the documentation.
missing_errors_doc = "allow"

[workspace.dependencies]
worklog-domain = { path = "crates/domain" }
worklog-app = { path = "crates/app" }
blake3 = "1"
# Without `clock`, which reads the time.
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order so a header keeps the order its keys were written in.
toml = { version = "1.1.8", features = ["preserve_order"] }

[package]
name = "worklog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Append-only versioned store of work done, durable facts, follow-ups and topics"
repository.workspace = true

[lints]
workspace = true

[dependencies]
worklog-domain.workspace = true
worklog-app.workspace = true
askama = "0.16"
blake3.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"
httparse = "1"
# The cache of the store's parsed tree, read whole by every command.
postcard = { version = "1", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rustix = { version = "1.1.4", features = ["system"] }
serde.workspace = true
# preserve_order so a value read back keeps the order its keys were printed in.
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
toml.workspace = true
# Keeps the comments and layout of an agent's config it adds a writable root to.
toml_edit = "0.25.17"
# gzip off: the release assets are binaries, and the redirect it reads
# for the tag carries no body.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
worklog-domain = { workspace = true, features = ["testing"] }
worklog-app = { workspace = true, features = ["testing"] }
# A test shrinks its sockets' buffers, so a page of a few hundred kilobytes fills them.
rustix = { version = "1.1.4", features = ["net"] }
assert_cmd = "2"
tempfile = "3"

# The upgrade scenario hashes a debug binary; unoptimised sha2 makes that
# the slowest test by far.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
