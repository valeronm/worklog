[package]
name = "worklog"
version = "0.5.11"
edition = "2024"
license = "MIT"
description = "Append-only versioned store of work done, durable facts, follow-ups and topics"
repository = "https://github.com/valeronm/worklog"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# In-memory ports for tests of the layers above the domain; never in a binary.
testing = []

[dependencies]
askama = "0.16"
blake3 = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
# The cache of the store's parsed tree, read whole by every command.
postcard = { version = "1", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rustix = { version = "1.1.4", features = ["system"] }
serde = { version = "1", features = ["derive"] }
# preserve_order so a value read back keeps the order its keys were printed in.
serde_json = { version = "1", features = ["preserve_order"] }
# The release checksums are shasum's, not the store's blake3.
sha2 = "0.10"
similar = "2"
tiny_http = "0.12"
# preserve_order so a header keeps the order its keys were written in.
toml = { version = "1.1.8", features = ["preserve_order"] }
# Keeps the comments and layout of an agent's config it adds a writable root to.
toml_edit = "0.25.17"
# gzip off: the release assets are binaries, and the redirect it reads
# for the tag carries no body.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

# The upgrade scenario hashes a debug binary; unoptimised sha2 makes that
# the slowest test by far.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = true
strip = true
