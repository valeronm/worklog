{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}Tags{% endblock %}
{% block content %}
<h1>Tags</h1>
<table>
<tr><th>Tag</th><th>Documents</th></tr>
{% for t in tags %}
<tr><td>{% call m::link(t.link) %}{% endcall %}</td><td class="n">{{ t.count }}</td></tr>
{% endfor %}
</table>
{% endblock %}
