[package]
name = "worklog-next"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "The store the next worklog keeps its documents in"
repository = "https://github.com/valeronm/worklog"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# In-memory ports for tests of the layers above the domain; never in a binary.
testing = []

[[bin]]
name = "worklog-next"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order so a value read back keeps the order its keys were printed in.
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
# preserve_order so a header keeps the order its keys were written in.
toml = { version = "1.1.8", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
