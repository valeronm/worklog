[package]
name = "worklog-next"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "The store the next worklog keeps its documents in"
repository = "https://github.com/valeronm/worklog"
publish = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# In-memory ports for tests of the layers above the domain; never in a binary.
testing = []

[[bin]]
name = "worklog-next"
path = "src/main.rs"

[dependencies]
askama = "0.16"
blake3 = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order so a value read back keeps the order its keys were printed in.
serde_json = { version = "1", features = ["preserve_order"] }
# The release checksums are shasum's, not the store's blake3.
sha2 = "0.10"
similar = "2"
tiny_http = "0.12"
# preserve_order so a header keeps the order its keys were written in.
toml = { version = "1.1.8", features = ["preserve_order"] }
# gzip off: the release assets are binaries, and the redirect it reads
# for the tag carries no body.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
