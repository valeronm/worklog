name: Rust toolchain
description: Install the Rust toolchain pinned in mise.toml and restore the build cache
inputs:
  components:
    description: rustup components, comma-separated
    default: ''
  cache:
    description: Restore the build cache, and save it on main
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install the toolchain pinned in mise.toml
      # so CI builds with the version a developer builds with
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rust_version=$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)
        rustup toolchain install "$rust_version" --profile minimal ${COMPONENTS:+--component "$COMPONENTS"}
        rustup default "$rust_version"

    - name: Remove the runner's other toolchains
      # rust-cache keys its cache on every installed toolchain.
      if: inputs.cache == 'true'
      shell: bash
      run: |
        pinned=$(rustup default | cut -d' ' -f1)
        for toolchain in $(rustup toolchain list --quiet); do
          if [ "$toolchain" != "$pinned" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Fetch every target's crates
      # A build downloads only its own target's crates; `cargo tree --offline`
      # reads every target's.
      shell: bash
      run: cargo fetch --locked
